# Gitleaks configuration for voiage
title = "voiage gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Repository allowlist for SHA-256 fixture digests, academic citation keys, and test symbols"
paths = [
  '''paper/joss-references\.verification\.json''',
  '''tests/fixtures/.*''',
  '''specs/.*''',
  '''benchmarks/.*''',
]
stopwords = [
  "andronis2016implementation",
  "claxton1999irrelevance",
  "mordaunt2025trdcea",
  "strong2014evppi",
  "_contains_secret",
  "replication/reproducibility",
]
regexes = [
  '''[0-9a-f]{64}''',
]

# Public gitlink provenance, not a credential. Both the exact report path and
# the complete provenance line must match; other values and files stay scanned.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Pinned public Authentext revision in the dated venue audit"
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)conductor/tracks/v2_2_release_and_venue_submissions_20260830/venue-authentext-audit-20260830\.json$''']
regexes = ['''^\s*"authentext_commit":\s*"7f70dad5b6deab1af92faf037ef2638e7f3aea05",?\s*$''']

[[rules.allowlists]]
description = "Verified public core API Git tree ID in packaging qualification"
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)conductor/tracks/pandas_free_io_20261026/phase-4-acceptance-python315\.json$''',
  '''(^|/)conductor/tracks/pandas_free_io_20261026/final-acceptance-python315\.json$''',
]
regexes = ['''^\s*"specs/core-api":\s*"3d5c0059778e303b466a58aa880badafc3e85eea",?\s*$''']
