name: R CMD Check and Retained Bindings CI

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
    paths:
      - "bindings/julia/**"
      - "r-package/**"
      - "rust/**"
      - "tests/ffi/**"
      - ".github/workflows/bindings-ci.yml"
      - "specs/core-api/fixtures/**"
      - "specs/numerical-reference/**"
      - "specs/abi/**"
      - "scripts/check_abi_compatibility.py"
  push:
    branches: [main]
    paths:
      - "bindings/julia/**"
      - "r-package/**"
      - "rust/**"
      - "tests/ffi/**"
      - ".github/workflows/bindings-ci.yml"
      - "specs/core-api/fixtures/**"
      - "specs/numerical-reference/**"
      - "specs/abi/**"
      - "scripts/check_abi_compatibility.py"

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert and record exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tested_head="$(git rev-parse HEAD)"
          test "${tested_head}" = "${EXPECTED_SOURCE_HEAD}"
          printf "### Exact source head\n\n\`%s\`\n" "${tested_head}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Compare C ABI with the v2.1.0 release baseline
        run: >-
          python3 scripts/check_abi_compatibility.py
          --baseline specs/abi/releases/v2.1.0
          --candidate-header rust/crates/voiage-ffi/include/voiage_v1.h
          --candidate-symbols specs/abi/v1/symbols.txt
          --candidate-layouts specs/abi/v1/layouts.txt
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Restore exact Rust dependency and target cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-stable-all-features-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
      - working-directory: rust
        run: cargo fmt --all --check
      - working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - working-directory: rust
        run: cargo test --workspace --all-features --locked

  rust-msrv:
    name: Rust workspace (MSRV 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.85"
      - working-directory: rust
        run: cargo check --workspace --all-targets --all-features --locked

  julia:
    name: Julia binding
    strategy:
      fail-fast: false
      matrix:
        julia:
          - "1.10"
          - "1.11"
          - "1.12"
        os:
          - runner: ubuntu-latest
            library: rust/target/release/libvoiage_ffi.so
          - runner: macos-latest
            library: rust/target/release/libvoiage_ffi.dylib
          - runner: windows-latest
            library: rust/target/release/voiage_ffi.dll
    runs-on: ${{ matrix.os.runner }}
    env:
      JULIA_DEPOT_PATH: ${{ github.workspace }}/.julia-depot
      JULIA_NUM_PRECOMPILE_TASKS: "1"
      VOIAGE_RUN_JULIA_AQUA: ${{ matrix.julia == '1.12' && matrix.os.runner == 'ubuntu-latest' && '1' || '0' }}
    defaults:
      run:
        working-directory: bindings/julia
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert and record exact source head
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tested_head="$(git rev-parse HEAD)"
          test "${tested_head}" = "${EXPECTED_SOURCE_HEAD}"
          printf "### Exact source head\n\n\`%s\`\n" "${tested_head}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Build the Rust C ABI used by Julia
        working-directory: rust
        run: cargo build --release --locked --package voiage-ffi
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32
        with:
          version: ${{ matrix.julia }}
      - name: Restore exact Julia depot cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.julia-depot
          key: julia-depot-${{ runner.os }}-${{ runner.arch }}-${{ matrix.julia }}-${{ hashFiles('bindings/julia/Project.toml') }}
      - name: Record Julia package-quality contract
        run: grep -F "Aqua.test_all" test/runtests.jl
      - name: Verify packaged EVPI fixture matches the canonical reference
        run: >-
          python -c
          "import json, pathlib;
          packaged = json.loads(pathlib.Path('test/fixtures/evpi-cases.json').read_text());
          canonical = json.loads(pathlib.Path('../../specs/numerical-reference/v1/evpi-cases.json').read_text());
          assert packaged == canonical"
      - name: Test a standalone Julia package copy
        shell: bash
        run: |
          runner_temp="${RUNNER_TEMP//\\//}"
          standalone_dir="${runner_temp}/voiage-julia-standalone"
          mkdir -p "${standalone_dir}"
          git -C ../.. archive HEAD:bindings/julia | tar -x -C "${standalone_dir}"
          cd "${standalone_dir}"
          STANDALONE_DIR="${standalone_dir}" julia --project=. -e '
            using Pkg
            project = Pkg.project()
            @assert project.name == "Voiage"
            @assert string(project.uuid) == "8c7ad020-41fd-4d68-9c3f-5d4e11c48f1f"
            Pkg.instantiate()
            Pkg.test()
          '
        env:
          VOIAGE_FFI_LIBRARY: ${{ github.workspace }}/${{ matrix.os.library }}

  r:
    name: R package-development checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r-package/voiageR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert and record exact source head
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tested_head="$(git rev-parse HEAD)"
          test "${tested_head}" = "${EXPECTED_SOURCE_HEAD}"
          printf "### Exact source head\n\n\`%s\`\n" "${tested_head}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Set up Python for reticulate reference checks
        id: r-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: any::rcmdcheck
          working-directory: r-package/voiageR
      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      - run: R CMD build .
      - run: Rscript tools/build-manual.R
      - name: Run CRAN-style source-package checks
        run: |
          for attempt in 1 2 3; do
            R CMD check --as-cran --no-manual voiageR_*.tar.gz && exit 0
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
        env:
          RETICULATE_PYTHON: ${{ steps.r-python.outputs.python-path }}
      - name: Run R package-development checks
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")'
        env:
          RETICULATE_PYTHON: ${{ steps.r-python.outputs.python-path }}

  r-native:
    name: R installed native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Restore exact R native Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            r-package/voiageR/src/rust/target
          key: r-native-rust-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ hashFiles('r-package/voiageR/src/rust/Cargo.lock') }}
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: any::testthat any::reticulate
          working-directory: r-package/voiageR
      - name: Install the R source package
        run: >-
          Rscript -e
          "install.packages('r-package/voiageR', repos = NULL, type = 'source')"
      - name: Run installed R native and numerical-reference checks
        env:
          VOIAGE_NUMERICAL_REFERENCE: ${{ github.workspace }}/specs/numerical-reference/v1/evpi-cases.json
        run: |
          Rscript -e "library(testthat); library(voiageR); test_file('r-package/voiageR/tests/testthat/test-native-ffi.R'); test_file('r-package/voiageR/tests/testthat/test-zz-numerical-reference.R')"

  differential-conformance:
    name: Cross-language differential conformance
    needs: [rust, julia, r-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.33"
      - name: Document retained runtime boundaries
        run: |
          printf '%s\n' \
            'Python public API' \
            'Rust crate API' \
            'C ABI' \
            'R installed package' \
            'Julia installed package'
          test -f specs/numerical-reference/v1/evpi-cases.json
      - name: Validate shared numerical reference corpus
        run: >-
          python -c
          "import json, pathlib;
          canonical=json.loads(pathlib.Path('specs/numerical-reference/v1/evpi-cases.json').read_text());
          julia=json.loads(pathlib.Path('bindings/julia/test/fixtures/evpi-cases.json').read_text());
          assert canonical == julia"
      - name: Exercise Python reference corpus
        run: uv run --extra ci pytest tests/test_numerical_reference_cases.py --no-cov -q
