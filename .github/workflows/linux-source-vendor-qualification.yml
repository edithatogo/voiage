name: Linux source and vendor qualification
on:
  pull_request:
    paths:
      - ".github/workflows/linux-source-vendor-qualification.yml"
      - "scripts/qualify_source_vendor.py"
      - "tests/test_source_vendor_qualification.py"
      - "packaging/current/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-source-vendor-qualification.yml"
      - "scripts/qualify_source_vendor.py"
      - "tests/test_source_vendor_qualification.py"
      - "packaging/current/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
      - run: |
          uv venv --python 3.15.1 .venv
          uv pip install --python .venv/bin/python pytest==9.1.1
          .venv/bin/python -m pytest --noconftest -o addopts= tests/test_source_vendor_qualification.py
  sources:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - entry: libcst
            toolchain: "1.99.1"
          - entry: maturin
            toolchain: "1.99.1"
          - entry: polars-runtime-32
            toolchain: "1.99.1"
          - entry: pydantic-core
            toolchain: "1.99.1"
          - entry: rpds-py
            toolchain: "1.99.1"
          - entry: uv-build
            toolchain: "1.99.1"
          - entry: voiage
            toolchain: "1.99.1"
          - entry: rust-stable
            toolchain: nightly-2026-09-01
          - entry: rust-nightly
            toolchain: nightly-2026-09-01
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Prepare source-only qualification tools
        timeout-minutes: 10
        run: |
          uv venv --python 3.15.1 .venv
          uv pip install --python .venv/bin/python psutil==7.2.2
      - name: Authenticate source and prove locked offline vendor replay
        env:
          ENTRY: ${{ matrix.entry }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          cargo_bin=$(rustup which --toolchain "$TOOLCHAIN" cargo)
          rustc_bin=$(rustup which --toolchain "$TOOLCHAIN" rustc)
          mkdir receipts
          git rev-parse HEAD > receipts/source-commit.txt
          git rev-parse 'HEAD^{tree}' > receipts/source-tree.txt
          .venv/bin/python --version > receipts/python.txt
          .venv/bin/python scripts/guard_verification.py --work-dir receipts/resources --workload-id "$ENTRY" --max-rss-mib 6000 --timeout-seconds 2400 --min-free-mib 8192 --artifact-dir "$RUNNER_TEMP/source-work" --             .venv/bin/python scripts/qualify_source_vendor.py --entry "$ENTRY" --work "$RUNNER_TEMP/source-work" --output receipts/qualification --cargo "$cargo_bin" --rustc "$rustc_bin"
      - name: Retain source identities, vendor and resource receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-source-vendor-${{ matrix.entry }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30
