name: Native Build Capacity Observation

on:
  workflow_dispatch:
  push:
    branches: [codex/native-build-capacity-20261028]
    paths:
      - .github/workflows/native-build-capacity-observation.yml

permissions:
  contents: read

concurrency:
  group: native-capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  polars-source-capacity:
    name: Measure current Polars native source build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install pinned uv without shared build caches
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Select qualified Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.1"
      - name: Build exact Polars runtime sources and record resource use
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import threading
          import time
          import urllib.request

          assert sys.version_info[:3] == (3, 15, 1), sys.version
          root = Path.cwd()
          evidence = root / "native-capacity-evidence"
          evidence.mkdir()
          workspace = Path(os.environ["RUNNER_TEMP"]) / "voiage-native-capacity"
          workspace.mkdir()
          manifest_path = root / "packaging/current/polars-provider-sources.json"
          manifest = json.loads(manifest_path.read_text())
          providers = manifest["providers"]
          runtime = providers["py-polars-runtime-32"]
          frontend = providers["py-polars"]
          env = dict(os.environ)
          env.update({
              "CARGO_HOME": str(workspace / "cargo"),
              "CARGO_TARGET_DIR": str(workspace / "target"),
              "UV_CACHE_DIR": str(workspace / "uv-cache"),
              "RUSTUP_TOOLCHAIN": runtime["rust_toolchain"],
          })
          started = time.monotonic()
          initial_free = shutil.disk_usage(workspace).free
          receipt = {
              "scope": "Current Polars source-build capacity pilot; not the HPC matrix",
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "python": sys.version,
              "cpu_count": os.cpu_count(),
              "cargo_build_jobs": env["CARGO_BUILD_JOBS"],
              "default_features": runtime["default_features"],
              "free_bytes_before": initial_free,
              "minimum_free_bytes": initial_free,
              "maximum_observed_disk_growth_bytes": 0,
              "sampling_interval_seconds": 5,
              "compiler_source_build_executed": False,
              "full_hpc_matrix_qualified": False,
              "steps": [],
              "outcome": "running",
          }
          stop = threading.Event()

          def save():
              (evidence / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")

          def sample():
              with (evidence / "filesystem-samples.jsonl").open("a") as output:
                  while True:
                      usage = shutil.disk_usage(workspace)
                      receipt["minimum_free_bytes"] = min(receipt["minimum_free_bytes"], usage.free)
                      receipt["maximum_observed_disk_growth_bytes"] = max(
                          receipt["maximum_observed_disk_growth_bytes"], initial_free - usage.free
                      )
                      output.write(json.dumps({"elapsed_seconds": round(time.monotonic() - started, 2),
                                               "free_bytes": usage.free, "used_bytes": usage.used}) + "\n")
                      output.flush()
                      save()
                      if stop.wait(5):
                          break

          def run(name, command):
              row = {"name": name, "argv": command, "exit_code": None}
              receipt["steps"].append(row)
              save()
              print(f"Starting {name}", flush=True)
              before = time.monotonic()
              with (evidence / f"{name}.log").open("w") as output:
                  result = subprocess.run(command, env=env, stdout=output, stderr=subprocess.STDOUT, check=False)
              row.update(exit_code=result.returncode, elapsed_seconds=round(time.monotonic() - before, 2))
              print(f"Completed {name}: exit {result.returncode}", flush=True)
              save()
              if result.returncode:
                  raise RuntimeError(f"{name} failed with exit {result.returncode}; see retained log")

          monitor = threading.Thread(target=sample)
          monitor.start()
          try:
              for row in (runtime, frontend):
                  source = row["source"]
                  assert source["url"].startswith("https://files.pythonhosted.org/packages/")
                  target = workspace / source["filename"]
                  with urllib.request.urlopen(source["url"], timeout=60) as response, target.open("wb") as output:
                      shutil.copyfileobj(response, output)
                  with target.open("rb") as stream:
                      actual = hashlib.file_digest(stream, "sha256").hexdigest()
                  assert actual == source["sha256"], source["filename"]
                  assert target.stat().st_size == source["size"], source["filename"]
              (evidence / "source-inputs.json").write_text(json.dumps(manifest, indent=2) + "\n")
              run("compiler-sdk", ["rustup", "toolchain", "install", runtime["rust_toolchain"], "--profile", "minimal"])
              run("compiler-identity", ["rustc", "--version", "--verbose"])
              compiler = json.loads((root / "packaging/current/rust-provider-sources.json").read_text())["nightly"]
              identity = (evidence / "compiler-identity.log").read_text()
              assert "commit-hash: " + compiler["commit"] in identity, identity
              assert "release: " + compiler["compiler_version"] in identity, identity
              run("create-environment", ["uv", "venv", "--python", sys.executable, str(workspace / "venv")])
              python = str(workspace / "venv/bin/python")
              install = ["uv", "pip", "install", "--python", python, "--no-deps", "--verbose"]
              guard = [sys.executable, "scripts/guard_verification.py", "--max-rss-mib", "11264",
                       "--min-free-mib", "2048", "--timeout-seconds", "1500",
                       "--work-dir", str(evidence / "runtime-guard"), "--"]
              run("runtime-source-build", guard + install + ["--no-binary", "polars-runtime-32", str(workspace / runtime["source"]["filename"])])
              run("frontend-source-build", install + [str(workspace / frontend["source"]["filename"])])
              probe = ("import polars as pl; import importlib.metadata as m; "
                       "assert pl.__version__ == '2.1.0'; "
                       "assert m.version('polars-runtime-32') == '2.1.0'; "
                       "assert pl.DataFrame({'x': [1, 2, 3]}).select(pl.col('x').sum()).item() == 6; "
                       "pl.show_versions()")
              run("installed-native-probe", [python, "-I", "-c", probe])
              receipt["outcome"] = "passed_scoped_source_build"
          except BaseException as exc:
              receipt["outcome"] = "failed_or_resource_limited"
              receipt["error"] = repr(exc)
              raise
          finally:
              stop.set()
              monitor.join()
              receipt["elapsed_seconds"] = round(time.monotonic() - started, 2)
              receipt["free_bytes_after"] = shutil.disk_usage(workspace).free
              with (evidence / "retained-directory-sizes.txt").open("w") as output:
                  subprocess.run(["du", "-h", "--max-depth=2", str(workspace)], stdout=output, stderr=subprocess.STDOUT, check=False)
              save()
          PY
      - name: Upload measurements and failure transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-capacity-evidence/
          if-no-files-found: error
          retention-days: 14
