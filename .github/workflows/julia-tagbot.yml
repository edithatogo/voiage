name: Julia Registry Sync

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagbot:
    name: TagBot
    if: github.actor == 'JuliaTagBot'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@14d7645453716d7a2f09b1da0504a024f97462a1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: bindings/julia
          tag_prefix: julia
