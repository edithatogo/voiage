name: Julia Registry Sync

on:
  # General sends registry notifications through a bot-owned closed issue.
  issue_comment: # zizmor: ignore[dangerous-triggers] -- The job validates the registry bot event.
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagbot:
    name: TagBot
    if: >-
      github.actor == 'JuliaTagBot' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.sender.id == 50554310 &&
          github.event.comment.user.id == 50554310 &&
          github.event.issue.user.id == 50554310 &&
          github.event.issue.state == 'closed' &&
          !github.event.issue.pull_request
        )
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # TagBot 1.25.7 clones with its token in a Git process argument. Leave
      # process telemetry off this job until the pinned action is corrected.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: JuliaRegistries/TagBot@6b7c22e7bc2b8f4d1c56b7199a63421cf2667ed1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: bindings/julia
          tag_prefix: julia
