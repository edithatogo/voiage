# Cross-platform assurance for the selected Python runtime.
name: C15 Cross-platform Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "voiage/**"
      - "rust/**"
      - "pyproject.toml"
      - "uv.lock"
      - "paper/**"
      - "scripts/coverage_artifact_identity.py"
      - "scripts/check_consumer_matrix.py"
      - "scripts/docx_validator/**"
      - "scripts/reproducible_build.py"
      - "scripts/c15_artifact_digest.py"
      - "scripts/c15_performance_ratchet.py"
      - "benchmarks/c15_performance_baseline_py315.json"
      - "tests/test_coverage_artifact_identity.py"
      - "tests/test_manuscript_docx_validator.py"
      - "tests/test_core_metrics_regression.py"
      - "tests/test_numerical_reference_cases.py"
      - "tests/test_polars_numerical_parity.py"
      - "tests/test_v2_stable_api_contract.py"
      - ".github/workflows/c15-cross-platform.yml"
  workflow_dispatch:


# Cancel obsolete pull-request runs while preserving independent main, schedule, and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_PYTHON: "3.15.2"
  BLIS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  coverage-identity:
    name: Coverage receipt identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
      - name: Test locked coverage identity dependencies
        run: |
          uv venv .venv --python 3.15.2
          uv export --frozen --extra ci --no-emit-project --no-hashes --no-annotate --output-file .locked-constraints.txt --quiet
          uv pip install --python .venv --constraint .locked-constraints.txt pytest GitPython
          uv run --no-project --python .venv python -c "import sys; assert sys.version_info[:3] == (3, 15, 2), sys.version"
          uv run --no-project --python .venv python -m pytest --noconftest -o addopts= -q tests/test_coverage_artifact_identity.py

  manuscript-docx-validator:
    name: Manuscript DOCX validator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "10.0.x"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
      - name: Prepare the selected Python environment
        run: |
          uv venv .venv --python 3.15.2
          uv pip install --python .venv pytest==9.2.0
      - name: Assert DOCX Python patch
        run: uv run --no-project --python .venv python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 15, 2), sys.version"
      - name: Verify required SDK and run DOCX qualification
        env:
          DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          uv run --no-project --python .venv python -c "import subprocess; assert any(x.startswith('10.') for x in subprocess.check_output(['dotnet', '--list-sdks'], text=True).splitlines()); assert any(x.startswith('Microsoft.NETCore.App 10.') for x in subprocess.check_output(['dotnet', '--list-runtimes'], text=True).splitlines())"
          uv run --no-project --python .venv python -m pytest --noconftest -o addopts= tests/test_manuscript_docx_validator.py -q

  distributions:
    name: Wheel and sdist identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: c15-dist-${{ runner.os }}
      - run: uv sync --frozen --extra ci --extra dev --group producer-tests
      - name: Assert synchronized Python patch
        run: uv run --frozen python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 15, 2), sys.version"
      - name: Build reproducible distributions
        run: >-
          uv run --frozen python scripts/reproducible_build.py .
          --output c15-evidence/reproducible-build.json --dist-dir dist
      - name: Record normalized wheel and sdist identities
        run: |
          uv run --frozen python scripts/c15_artifact_digest.py record --archive-dir dist --kind wheel --runner "${{ runner.os }}-${{ runner.arch }}" --output c15-evidence/report-wheel.json
          uv run --frozen python scripts/c15_artifact_digest.py record --archive-dir dist --kind sdist --runner "${{ runner.os }}-${{ runner.arch }}" --output c15-evidence/report-sdist.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: c15-digest-${{ runner.os }}
          path: c15-evidence/
          if-no-files-found: error
          retention-days: 30

  compare-distributions:
    needs: distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
      - run: uv sync --frozen --extra ci --group producer-tests
      - name: Assert synchronized Python patch
        run: uv run --frozen python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 15, 2), sys.version"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: c15-digest-*
          path: c15-digests
      - name: Compare wheel identities
        id: compare-wheel
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/c15_artifact_digest.py compare
          --left c15-digests/c15-digest-Linux/report-wheel.json
          --right c15-digests/c15-digest-Windows/report-wheel.json
          --output c15-evidence/comparison-wheel.json
      - name: Compare sdist identities
        id: compare-sdist
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/c15_artifact_digest.py compare
          --left c15-digests/c15-digest-Linux/report-sdist.json
          --right c15-digests/c15-digest-Windows/report-sdist.json
          --output c15-evidence/comparison-sdist.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: c15-cross-platform-comparison
          path: c15-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce comparisons after evidence retention
        if: >-
          always() &&
          (steps.compare-wheel.outcome != 'success' ||
           steps.compare-sdist.outcome != 'success')
        run: exit 1

  performance:
    name: Bootstrap performance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: c15-performance-${{ runner.os }}
      - run: uv sync --frozen --extra ci --group producer-tests
      - name: Assert synchronized Python patch
        run: uv run --frozen python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 15, 2), sys.version"
      - name: Run ratchet and retain failure decision
        id: ratchet
        continue-on-error: true
        run: >-
          uv run --frozen python scripts/c15_performance_ratchet.py
          --baseline benchmarks/c15_performance_baseline_py315.json
          --output c15-evidence/performance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: c15-performance-${{ runner.os }}
          path: c15-evidence/performance.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce performance after evidence retention
        if: always() && steps.ratchet.outcome != 'success'
        run: exit 1

  telemetry-and-oracles:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15.2"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: c15-telemetry-oracles
      # The experimental serializers/database are not used by these checks.
      - run: uv sync --frozen --extra ci --group producer-tests
      - name: Assert synchronized Python patch
        run: uv run --frozen --no-sync python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 15, 2), sys.version"
      - name: Require scientific oracle backends
        run: uv run --frozen --no-sync python -c "import jax.numpy; import polars"
      - run: uv run --frozen --no-sync python scripts/c15_otel_probe.py --output c15-evidence/otel-probe.json
      - name: Verify privacy and scientific surfaces
        env:
          JAX_ENABLE_X64: "1"
        run: >-
          uv run --frozen --no-sync pytest -q --no-cov
          tests/test_c15_reproducibility.py tests/test_c15_performance.py
          tests/test_c15_otel.py tests/test_c15_oracles.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: c15-telemetry-oracle-evidence
          path: c15-evidence/
          if-no-files-found: error
          retention-days: 30
