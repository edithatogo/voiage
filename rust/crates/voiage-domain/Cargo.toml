[package]
name = "voiage-domain"
description = "Validated, binding-independent domain contracts for voiage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["value-of-information", "decision-analysis", "statistics"]
categories = ["science"]

[lints]
workspace = true

[dependencies]
num-rational = "0.4.2"
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# proptest 1.12 requires Rust 1.88; retain the workspace's Rust 1.85 MSRV.
# The default lock retains Rust 1.85; a separate CI lock tests Proptest 1.12.
proptest = ">=1.7, <1.13"
serde_json = "1.0"
